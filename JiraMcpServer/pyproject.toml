[project]
name = "jira-mcp-server"
version = "1.0.0"
description = "MCP server (FastAPI + official MCP Python SDK) exposing Jira Cloud REST APIs to AI assistants"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3,<3",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.12",
    "pydantic-settings>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[project.scripts]
jira-mcp-server = "jira_mcp.app:main"
jira-mcp-demo = "jira_mcp.client_demo:main"
jira-mcp-hash-key = "jira_mcp.security:hash_cli"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jira_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
pythonpath = ["src"]
